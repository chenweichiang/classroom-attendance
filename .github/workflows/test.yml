# tests/gate.sh --quick on every PR and every push to main.
# 本機怎麼跑、每一層在抓什麼：tests/README.md。
#
# quick 的九層（static unit state scenario fuzz e2e e2e-edge e2e-friction e2e-teacher）在 CI 全部照跑。
# 不排除任何測試，也不略過整層。
# full 才有的四層不在這裡：realtime、rehearsal 靠真實時鐘與固定秒數判定，共用 runner 的 CPU 被分走時
# 結果不穩定；load 是 47 人壓測，量的是 runner 而不是程式；flaky 重跑五次，時間太長。部署前在本機跑 --full。
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 與 Dockerfile（python:3.12-slim）及 pyproject.toml 的 pythonVersion 一致
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # 每個 action 都釘在 commit SHA，標籤被改指也不會換掉執行的程式；更新由 Dependabot 開 PR
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        run: |
          uv venv .venv -p python3.12
          uv pip install -p .venv/bin/python -r requirements.txt -r tests/requirements-dev.lock

      # WebKit 需要一批系統函式庫，全新 Ubuntu 沒有；--with-deps 會用 apt 裝齊
      - name: Install Playwright browsers
        run: .venv/bin/python -m playwright install --with-deps chromium webkit

      - name: tests/gate.sh --quick
        run: tests/gate.sh --quick

      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: attend-gate-logs
          path: /tmp/attend-gate/*.log
          retention-days: 7
