# tests/gate.sh --quick on every PR and every push to main.
# 本機怎麼跑、每一層在抓什麼：tests/README.md。
#
# quick 的九層（static unit state scenario fuzz e2e e2e-edge e2e-friction e2e-teacher）在 CI 全部照跑。
# 只排除一條測試（見下方 PYTEST_ADDOPTS），不略過整層。
# full 才有的四層不在這裡：realtime、rehearsal 靠真實時鐘與固定秒數判定，共用 runner 的 CPU 被分走時
# 結果不穩定；load 是 47 人壓測，量的是 runner 而不是程式；flaky 重跑五次，時間太長。部署前在本機跑 --full。
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 與 Dockerfile（python:3.12-slim）及 pyproject.toml 的 pythonVersion 一致
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # setup-uv 從 v8 起不再提供 v10 這類浮動主版號標籤，只能釘完整版號
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: |
          uv venv .venv -p python3.12
          uv pip install -p .venv/bin/python -r requirements.txt -r tests/requirements-dev.lock

      # WebKit 需要一批系統函式庫，全新 Ubuntu 沒有；--with-deps 會用 apt 裝齊
      - name: Install Playwright browsers
        run: .venv/bin/python -m playwright install --with-deps chromium webkit

      - name: tests/gate.sh --quick
        env:
          # test_checkin_ok_events_do_not_deadlock_main_transaction 以「總耗時 < 6 秒」判斷有沒有鎖死，
          # 但那段流程包含 20 次 PBKDF2-SHA256（600,000 次迭代）PIN 雜湊，耗時與 CPU 成正比：
          # 2026-09-25 在一般雲端 x86 機器上每次約 0.45 秒，沒有鎖死也要 10 秒以上，必定失敗。
          # 這條測試由私人 repo 匯出、公開版不能改，先在 CI 排除；原因與重現步驟記在引入本檔的 PR 說明。
          # 排除後覆蓋率仍達 97% 門檻（本機實測 97.44%）。
          PYTEST_ADDOPTS: >-
            --deselect tests/test_teacher_friction.py::test_checkin_ok_events_do_not_deadlock_main_transaction
        run: tests/gate.sh --quick

      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: attend-gate-logs
          path: /tmp/attend-gate/*.log
          retention-days: 7
